<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101114"><title>Calcar</title><style>*{box-sizing:border-box}body{margin:0;background:#101114;color:#f7f7f8;font:16px system-ui,-apple-system,sans-serif}header{padding:16px 18px;font-size:21px;font-weight:750}#stage{position:relative;height:58dvh;min-height:260px;background:#050505;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#drawing{position:absolute;top:50%;left:50%;width:65%;max-height:95%;object-fit:contain;transform:translate(-50%,-50%);pointer-events:none;display:none;opacity:.5}#status{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#ddd;pointer-events:none}main{padding:16px;display:grid;gap:16px;max-width:720px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,.pick{border:0;border-radius:12px;padding:14px 10px;font:600 15px system-ui;text-align:center;cursor:pointer;background:#f5f5f5;color:#111}.pick{background:#32343a;color:white}.pick input{display:none}label.control{display:grid;gap:8px}input[type=range]{width:100%;accent-color:#a4b7ff}small{color:#aaa;line-height:1.5}#error{color:#ffbb82;display:none;font-size:14px;line-height:1.4}</style></head><body><header>📷 Calcar</header><section id="stage"><video id="camera" autoplay muted playsinline></video><img id="drawing" alt="Dibujo para calcar"><div id="status">Pulsa «Encender cámara»</div></section><main><div class="actions"><button id="start">📷 Encender cámara</button><label class="pick">🖼️ Elegir dibujo<input id="file" type="file" accept="image/*"></label></div><div id="error" role="alert"></div><label class="control">Tamaño del dibujo: <span id="sizeValue">65%</span><input id="size" type="range" min="15" max="180" value="65"></label><label class="control">Opacidad del dibujo: <span id="opacityValue">50%</span><input id="opacity" type="range" min="0" max="100" value="50"></label><small>Primera versión: superpone un dibujo sobre la cámara. Todavía no incluye anclaje al papel. Para utilizar la cámara, abre la web publicada con HTTPS y acepta el permiso.</small></main><script>const camera=document.querySelector('#camera'),drawing=document.querySelector('#drawing'),status=document.querySelector('#status'),error=document.querySelector('#error');let stream=null,objectURL=null;document.querySelector('#start').addEventListener('click',async()=>{error.style.display='none';if(!navigator.mediaDevices?.getUserMedia){error.textContent='Este navegador o dirección no permite usar la cámara. Abre la web publicada por HTTPS.';error.style.display='block';return}try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'}}});camera.srcObject=stream;await camera.play();status.style.display='none';document.querySelector('#start').textContent='🔄 Reiniciar cámara'}catch(e){error.textContent='No se pudo activar la cámara ('+e.name+'). Revisa los permisos de cámara del navegador.';error.style.display='block'}});document.querySelector('#file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(objectURL)URL.revokeObjectURL(objectURL);objectURL=URL.createObjectURL(f);drawing.src=objectURL;drawing.style.display='block'});document.querySelector('#size').addEventListener('input',e=>{drawing.style.width=e.target.value+'%';document.querySelector('#sizeValue').textContent=e.target.value+'%'});document.querySelector('#opacity').addEventListener('input',e=>{drawing.style.opacity=e.target.value/100;document.querySelector('#opacityValue').textContent=e.target.value+'%'});window.addEventListener('pagehide',()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});</script></body></html>
